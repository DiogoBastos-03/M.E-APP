name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Modo de build do APK'
        type: choice
        options: [release, debug]
        default: release
      api_base_url:
        description: 'URL base da API embutida no APK'
        type: string
        default: 'https://api.mesaude.com'

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # URL usada quando o build nao vem de um workflow_dispatch com input proprio.
  API_BASE_URL_DEFAULT: 'https://api.mesaude.com'
  # Organizacao usada ao gerar a plataforma Android (espelha o bundle id do iOS,
  # com.medev.meApp) -> applicationId com.medev.me_app.
  ANDROID_ORG: 'com.medev'
  JAVA_VERSION: '17'

jobs:
  analyze:
    name: Analise estatica e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

  build:
    # Nao depende do job analyze de proposito: o APK sai mesmo com lint pendente,
    # e a qualidade aparece como um check separado.
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          # Para travar uma versao exata, troque por: flutter-version: 3.35.0
          channel: stable
          cache: true

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Definir parametros do build
        id: cfg
        run: |
          MODE="${{ inputs.build_mode || 'release' }}"
          API_URL="${{ inputs.api_base_url || env.API_BASE_URL_DEFAULT }}"
          VERSION="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml | head -1)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          APK_NAME="me-app-${MODE}-v${VERSION}-build${{ github.run_number }}-${SHORT_SHA}.apk"

          {
            echo "mode=${MODE}"
            echo "api_url=${API_URL}"
            echo "version=${VERSION}"
            echo "apk_name=${APK_NAME}"
          } >> "$GITHUB_OUTPUT"

          echo "Modo: ${MODE} | Versao: ${VERSION} | API: ${API_URL}"

      - name: flutter pub get
        run: flutter pub get

      - name: Gerar plataforma Android (se ausente)
        run: |
          if [ -d android ]; then
            echo "android/ versionado no repositorio - usando como esta."
          else
            echo "::notice::android/ ausente - gerando com flutter create (nao e commitado)."
            flutter create --platforms=android --org "${ANDROID_ORG}" --project-name me_app .
          fi

      - name: Preparar android/ (permissao INTERNET e assinatura)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          SIGNING_FLAG=""
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > android/app/me-release.jks
            {
              echo "storePassword=${KEYSTORE_PASSWORD}"
              echo "keyPassword=${KEY_PASSWORD}"
              echo "keyAlias=${KEY_ALIAS}"
              echo "storeFile=me-release.jks"
            } > android/key.properties
            SIGNING_FLAG="--signing"
            echo "::notice::Keystore encontrado - o release sera assinado com a chave de producao."
          else
            echo "::notice::Sem ANDROID_KEYSTORE_BASE64 - o release sera assinado com a chave debug (instalavel, mas nao publicavel na Play Store)."
          fi
          python3 .github/scripts/prepare_android.py ${SIGNING_FLAG}

      - name: Build do APK
        run: |
          flutter build apk --${{ steps.cfg.outputs.mode }} \
            --dart-define=API_BASE_URL=${{ steps.cfg.outputs.api_url }} \
            --build-number=${{ github.run_number }}

      - name: Renomear APK
        run: |
          mkdir -p artifacts
          cp "build/app/outputs/flutter-apk/app-${{ steps.cfg.outputs.mode }}.apk" \
             "artifacts/${{ steps.cfg.outputs.apk_name }}"
          ls -lh artifacts/

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.apk_name }}
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Resumo do build
        run: |
          SIZE="$(du -h "artifacts/${{ steps.cfg.outputs.apk_name }}" | cut -f1)"
          {
            echo "### APK gerado"
            echo ""
            echo "| Campo | Valor |"
            echo "| --- | --- |"
            echo "| Arquivo | \`${{ steps.cfg.outputs.apk_name }}\` |"
            echo "| Modo | ${{ steps.cfg.outputs.mode }} |"
            echo "| Versao | ${{ steps.cfg.outputs.version }} (build ${{ github.run_number }}) |"
            echo "| API | ${{ steps.cfg.outputs.api_url }} |"
            echo "| Tamanho | ${SIZE} |"
            echo ""
            echo "Baixe em **Artifacts**, no rodape desta pagina."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Anexar APK a release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar APK
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Criar/atualizar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/*.apk \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/*.apk \
              --repo "${GITHUB_REPOSITORY}" --generate-notes
          fi
